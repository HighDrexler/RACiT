      <path d="M403 187L385 164V84L408 60H506M570 187V121H598M643 85L647 60H783M697 187V97" stroke="#eaffff" stroke-width="3"/>
      <path d="M98 118H145L156 106V89M112 138L151 187H183M296 137H269M432 161H490L508 146M730 96V187" stroke="#132b3b" stroke-width="3" opacity="0.62"/>
    </g>
    <circle cx="584" cy="76" r="29" fill="url(#copper)" stroke="#263e4d" stroke-width="4"/>
    <circle cx="584" cy="76" r="22" fill="url(#dial)" stroke="#e4f4ed" stroke-width="2"/>
    <path d="M584 57V61M603 76H599M584 95V91M565 76H569" stroke="#86dbe2" stroke-width="2"/>
    <path d="M574 69L584 76L594 63" fill="none" stroke="#ddffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="584" cy="76" r="3" fill="#ffd38b"/>
