<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
  <title id="title">RACiT</title>
  <desc id="desc">Custom RACiT wordmark with angular copper and steel lettering and a small clock above the lowercase i.</desc>
  <defs>
    <linearGradient id="copper" x1="0" y1="54" x2="0" y2="193" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3ca"/><stop offset="0.12" stop-color="#ffcd77"/>
      <stop offset="0.43" stop-color="#c67429"/><stop offset="0.46" stop-color="#8e3f1c"/>
      <stop offset="0.55" stop-color="#d48232"/><stop offset="0.88" stop-color="#f2b95d"/>
      <stop offset="1" stop-color="#a75b27"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="54" x2="0" y2="193" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.15" stop-color="#d3eef2"/>
      <stop offset="0.43" stop-color="#7398ab"/><stop offset="0.46" stop-color="#344e66"/>
      <stop offset="0.55" stop-color="#7ab2c6"/><stop offset="0.88" stop-color="#e6f8f6"/>
      <stop offset="1" stop-color="#698fa7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="40" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5f5e9"/><stop offset="0.36" stop-color="#7d949c"/>
      <stop offset="0.65" stop-color="#2e4859"/><stop offset="1" stop-color="#90dcdf"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="54" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#263746"/><stop offset="0.65" stop-color="#17232d"/>
      <stop offset="1" stop-color="#335d6b"/>
    </linearGradient>
    <radialGradient id="dial">
      <stop offset="0" stop-color="#22576a"/><stop offset="0.72" stop-color="#142d3f"/>
      <stop offset="1" stop-color="#091b29"/>
    </radialGradient>
    <g id="warm" fill-rule="evenodd">
      <path d="M58 54H155L188 77V116L165 137L194 193H147L110 143H97V193H58ZM97 83V113H143L150 105V91L139 83Z"/>
      <path d="M224 193L259 54H310L361 193H315L307 166H259L252 193ZM268 133H297L282 87Z" stroke-miterlimit="2"/>
    </g>
    <g id="cool" fill-rule="evenodd">
      <path d="M405 54H508L532 78L507 108L491 91H430L420 102V145L431 156H488L509 138L532 166L508 193H405L379 166V82Z"/>
      <path d="M564 115H604V181L592 193H564Z"/>
      <path d="M642 54H790L784 91H735V193H691V91H636Z"/>
    </g>
    <g id="letters">
      <use href="#warm"/><use href="#cool"/><circle cx="584" cy="76" r="29"/>
    </g>
  </defs>
  <g transform="matrix(1 0 -0.16 1 40 0)" stroke-linejoin="miter">
    <use href="#letters" transform="translate(9 12)" fill="url(#depth)" stroke="#0d1b27" stroke-width="18"/>
    <use href="#letters" transform="translate(6 8)" fill="url(#depth)" stroke="url(#edge)" stroke-width="9"/>
    <use href="#letters" fill="#233340" stroke="#0d1b27" stroke-width="18"/>
    <use href="#letters" fill="#233340" stroke="url(#edge)" stroke-width="12"/>
    <use href="#warm" fill="url(#copper)" stroke="#563523" stroke-width="5"/>
    <use href="#cool" fill="url(#steel)" stroke="#203c50" stroke-width="5"/>
    <g fill="none" stroke-linecap="square">
